[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyml"
dynamic = ["version"]
description = "Pure Python Machine Learning - classic algorithms from scratch"
requires-python = ">=3.12"
authors = [
    {name = "Sherzod Juraev", email = "juraevsherzod9943@gmail.com"},
]
readme = "README.md"
license = "MIT"
keywords = [
    "machine-learning",
    "education",
    "from-scratch",
]
classifiers = [
    "Development Status :: 4 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-sugar>=1.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "interrogate>=1.7.0",
]
docs = [
    "sphinx>=7.0.0",
    "pydata-sphinx-theme>=0.15.0",
    "sphinx-design>=0.5.0",
    "sphinx-lint>=1.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-notfound-page>=1.1.0",
    "sphinx-autodoc-typehints>=2.2.0",
    "rstcheck>=6.0.0",
    "doc8>=1.0.0",
    "matplotlib>=3.9.0",
]
live = [
    "pyml[docs]",
    "sphinx-autobuild>=2025.8.25",
]
all = [
    "pyml[dev]",
    "pyml[live]",
]

[project.urls]
Homepage = "https://github.com/sherzod-juraev/pyml"
Documentation = "https://pyml-edu.readthedocs.io"
Repository = "https://github.com/sherzod-juraev/pyml"

[project.scripts]
check-pyml = "scripts.check_pyml:main"
check-docs = "scripts.check_docs:main"
check-tests = "scripts.check_tests:main"
check-all = "scripts.check_all:main"

[tool.setuptools.dynamic]
version = {attr = "pyml.__version__"}

[tool.setuptools.packages.find]
where = [".",]
include = [
    "pyml",
    "pyml.*",
]
exclude = [
    "tests",
    "tests.*",
    "docs",
    "docs.*",
    "scripts",
    "scripts.*",
]

[tool.setuptools.package-data]
pyml = ["**/*.pyi",]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests",]
python_files = ["test_*.py", "*_test.py",]
python_classes = ["Test*",]
python_functions = ["test_*",]
addopts = "-v --tb=short --strict-markers --strict-config -p no:warnings"
filterwarnings = ["ignore::UserWarning",]

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "pyml/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]
exclude = [
    "pyml/__pycache__",
    "pyml/**/__pycache__",
    "tests/__pycache__",
    "tests/**/__pycache__",
    "scripts/__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "D",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
]
ignore = [
    "N803",
    "N806",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",
    "N802",
    "SIM",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.interrogate]
fail-under = 100
verbose = 1
quiet = false
whitelist-regex = []
color = true
exclude = [
    "docs",
    "tests",
    "scripts",
]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false

[tool.rstcheck]
ignore_directives = [
    "button-link",
    "button-ref",
    "card",
    "toctree",
    "automodule",
    "autoclass",
    "autofunction",
    "tab-item",
    "tab-set",
    "grid",
    "only",
    "grid-item-card",
    "plot",
    "dropdown",
]
ignore_rules = [
    "meth",
    "func",
    "class",
    "doc",
    "ref",
]
report_level = "warning"
ignore_paths = [
    "docs/build/*",
]

[tool.doc8]
max-line-length = 100
ignore_paths = [
    "docs/build",
    "docs/source/_static",
]

[tool.sphinx-lint]
max-line-length = 100
exclude = [
    "docs/build",
]
