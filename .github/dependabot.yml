version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    # Update only uv.lock. The lower bounds in pyproject.toml are the versions pyml supports,
    # so they are changed by hand and checked by the nox session tests-min.
    versioning-strategy: lockfile-only
    groups:
      python-dependencies:
        patterns: ["*"]
